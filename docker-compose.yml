services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodgo
      POSTGRES_USER: foodgo
      POSTGRES_PASSWORD: foodgo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foodgo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodgo-postgres:
